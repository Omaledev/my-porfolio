<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="lvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091c18"/>
      <stop offset="50%" stop-color="#0f2e26"/>
      <stop offset="100%" stop-color="#061310"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowLv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#lvBg)"/>
  <circle cx="680" cy="90" r="140" fill="#14b8a6" opacity="0.16" filter="url(#glowLv)"/>
  <circle cx="120" cy="380" r="160" fill="#10b981" opacity="0.14" filter="url(#glowLv)"/>

  <!-- Browser Frame -->
  <rect x="40" y="40" width="720" height="400" rx="16" fill="#091e19" stroke="#174438" stroke-width="2"/>
  <path d="M 40 56 Q 40 40 56 40 L 744 40 Q 760 40 760 56 L 760 84 L 40 84 Z" fill="#102e26"/>
  <circle cx="70" cy="62" r="6" fill="#ff5f56"/>
  <circle cx="90" cy="62" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="62" r="6" fill="#27c93f"/>
  <rect x="250" y="52" width="300" height="20" rx="6" fill="#061511" stroke="#225a4c" stroke-width="1"/>
  <text x="400" y="66" fill="#5eead4" font-family="system-ui" font-size="11" text-anchor="middle">lightvitalwellness.com/store</text>

