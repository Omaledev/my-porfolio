    <text x="24" y="48" fill="#99f6e4" font-family="system-ui" font-size="12">Interactive Product Catalog • Cart State Management • Seamless Checkout</text>
    <rect x="540" y="16" width="108" height="34" rx="6" fill="url(#tealGrad)"/>
    <text x="594" y="38" fill="#042f2e" font-family="system-ui" font-weight="bold" font-size="12" text-anchor="middle">Shop Live</text>
  </g>

  <!-- Products Grid -->
  <g transform="translate(64, 186)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="210" height="230" rx="10" fill="#0d2620" stroke="#194c40" stroke-width="1"/>
    <rect x="20" y="20" width="170" height="100" rx="8" fill="#143b32"/>
    <text x="105" y="80" fill="#5eead4" font-family="system-ui" font-size="34" text-anchor="middle">🌿</text>
    <text x="20" y="146" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="13">Vital Herbal Infusions</text>
    <text x="20" y="166" fill="#5eead4" font-family="system-ui" font-weight="bold" font-size="14">₦ 8,500 <tspan fill="#94a3b8" font-size="11">/ 250g</tspan></text>
    <rect x="20" y="184" width="170" height="30" rx="6" fill="#14b8a6"/>
    <text x="105" y="204" fill="#042f2e" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">Add to Cart</text>

    <!-- Product 2 -->
    <rect x="230" y="0" width="210" height="230" rx="10" fill="#0d2620" stroke="#194c40" stroke-width="1"/>
    <rect x="250" y="20" width="170" height="100" rx="8" fill="#143b32"/>
    <text x="335" y="80" fill="#5eead4" font-family="system-ui" font-size="34" text-anchor="middle">🍯</text>
    <text x="250" y="146" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="13">Raw Forest Honey</text>
    <text x="250" y="166" fill="#5eead4" font-family="system-ui" font-weight="bold" font-size="14">₦ 6,200 <tspan fill="#94a3b8" font-size="11">/ 500ml</tspan></text>
    <rect x="250" y="184" width="170" height="30" rx="6" fill="#14b8a6"/>
    <text x="335" y="204" fill="#042f2e" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">Add to Cart</text>

    <!-- Product 3 -->
    <rect x="460" y="0" width="212" height="230" rx="10" fill="#0d2620" stroke="#194c40" stroke-width="1"/>
    <rect x="480" y="20" width="170" height="100" rx="8" fill="#143b32"/>
    <text x="565" y="80" fill="#5eead4" font-family="system-ui" font-size="34" text-anchor="middle">🌱</text>
    <text x="480" y="146" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="13">Cold-Pressed Oils</text>
    <text x="480" y="166" fill="#5eead4" font-family="system-ui" font-weight="bold" font-size="14">₦ 11,000 <tspan fill="#94a3b8" font-size="11">/ bottle</tspan></text>
    <rect x="480" y="184" width="170" height="30" rx="6" fill="#14b8a6"/>
    <text x="565" y="204" fill="#042f2e" font-family="system-ui" font-weight="bold" font-size="11" text-anchor="middle">Add to Cart</text>
