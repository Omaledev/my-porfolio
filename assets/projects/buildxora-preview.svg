<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="50%" stop-color="#12253b"/>
      <stop offset="100%" stop-color="#080f18"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glowBx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bxBg)"/>
  <circle cx="680" cy="100" r="140" fill="#f59e0b" opacity="0.14" filter="url(#glowBx)"/>
  <circle cx="100" cy="380" r="160" fill="#0284c7" opacity="0.12" filter="url(#glowBx)"/>

  <!-- Browser Frame -->
  <rect x="40" y="40" width="720" height="400" rx="16" fill="#0b1726" stroke="#1d385c" stroke-width="2"/>
  <path d="M 40 56 Q 40 40 56 40 L 744 40 Q 760 40 760 56 L 760 84 L 40 84 Z" fill="#132338"/>
  <circle cx="70" cy="62" r="6" fill="#ff5f56"/>
  <circle cx="90" cy="62" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="62" r="6" fill="#27c93f"/>
  <rect x="250" y="52" width="300" height="20" rx="6" fill="#091321" stroke="#254673" stroke-width="1"/>
  <text x="400" y="66" fill="#38bdf8" font-family="system-ui" font-size="11" text-anchor="middle">buildxora.com/marketplace</text>

  <!-- Banner -->
  <g transform="translate(64, 100)">
    <rect x="0" y="0" width="672" height="74" rx="10" fill="#132742" stroke="#234675" stroke-width="1"/>
    <text x="24" y="32" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="16">BuildXora — Construction &amp; Real Estate Platform</text>
    <text x="24" y="54" fill="#94a3b8" font-family="system-ui" font-size="12">Connecting Clients, Certified Artisans, Material Suppliers &amp; Property Agents</text>
    <rect x="540" y="20" width="108" height="34" rx="6" fill="url(#amberAccent)"/>
    <text x="594" y="42" fill="#0b1726" font-family="system-ui" font-weight="bold" font-size="12" text-anchor="middle">Founder &amp; Dev</text>
  </g>

  <!-- Grid of Modules -->
  <g transform="translate(64, 192)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="210" height="220" rx="10" fill="#0d1f36" stroke="#1f416e" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#f59e0b" opacity="0.2"/>
    <text x="36" y="42" fill="#f59e0b" font-family="system-ui" font-size="20" text-anchor="middle">👷</text>
    <text x="16" y="80" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="14">Artisans &amp; Pros</text>
    <text x="16" y="104" fill="#94a3b8" font-family="system-ui" font-size="11">Verified builders, plumbers, electricians with ratings and escrow milestone protection.</text>
    <rect x="16" y="174" width="70" height="20" rx="4" fill="#1b3961"/>
    <text x="51" y="188" fill="#38bdf8" font-family="system-ui" font-size="10" text-anchor="middle">Livewire</text>

    <!-- Card 2 -->
    <rect x="230" y="0" width="210" height="220" rx="10" fill="#0d1f36" stroke="#1f416e" stroke-width="1"/>
    <rect x="246" y="16" width="40" height="40" rx="8" fill="#38bdf8" opacity="0.2"/>
    <text x="266" y="42" fill="#38bdf8" font-family="system-ui" font-size="20" text-anchor="middle">🧱</text>
    <text x="246" y="80" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="14">Building Materials</text>
    <text x="246" y="104" fill="#94a3b8" font-family="system-ui" font-size="11">Direct factory and distributor pricing, bulk orders, and real-time haulage tracking.</text>
    <rect x="246" y="174" width="70" height="20" rx="4" fill="#1b3961"/>
    <text x="281" y="188" fill="#38bdf8" font-family="system-ui" font-size="10" text-anchor="middle">Laravel</text>

    <!-- Card 3 -->
    <rect x="460" y="0" width="212" height="220" rx="10" fill="#0d1f36" stroke="#1f416e" stroke-width="1"/>
    <rect x="476" y="16" width="40" height="40" rx="8" fill="#34d399" opacity="0.2"/>
    <text x="496" y="42" fill="#34d399" font-family="system-ui" font-size="20" text-anchor="middle">🏡</text>
    <text x="476" y="80" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="14">Property Listings</text>
    <text x="476" y="104" fill="#94a3b8" font-family="system-ui" font-size="11">Land sales, residential developments, verified deeds, and direct buyer connections.</text>
    <rect x="476" y="174" width="70" height="20" rx="4" fill="#1b3961"/>
    <text x="511" y="188" fill="#34d399" font-family="system-ui" font-size="10" text-anchor="middle">MySQL</text>
  </g>
</svg>
