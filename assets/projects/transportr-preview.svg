<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1026"/>
      <stop offset="50%" stop-color="#141a38"/>
      <stop offset="100%" stop-color="#070c1d"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad1)"/>
  
  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="650" cy="120" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow1)"/>
  <circle cx="150" cy="380" r="160" fill="#7928ca" opacity="0.15" filter="url(#glow1)"/>

  <!-- Mockup Window Browser -->
  <rect x="40" y="40" width="720" height="400" rx="16" fill="#0d1428" stroke="#1f2c4f" stroke-width="2"/>
  
  <!-- Window Header -->
  <path d="M 40 56 Q 40 40 56 40 L 744 40 Q 760 40 760 56 L 760 84 L 40 84 Z" fill="#131b34"/>
  <circle cx="70" cy="62" r="6" fill="#ff5f56"/>
  <circle cx="90" cy="62" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="62" r="6" fill="#27c93f"/>
  <rect x="240" y="52" width="320" height="20" rx="6" fill="#0b1021" stroke="#25355e" stroke-width="1"/>
  <text x="400" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">api.transportr.africa/v1/routes</text>

  <!-- Dashboard Content -->
  <!-- Stats row -->
  <g transform="translate(64, 104)">
    <rect x="0" y="0" width="150" height="64" rx="10" fill="#131c38" stroke="#263968" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="system-ui" font-size="11">CONNECTED FLEETS</text>
    <text x="16" y="48" fill="#ffffff" font-family="system-ui" font-weight="bold" font-size="18">4 Operators</text>

    <rect x="170" y="0" width="150" height="64" rx="10" fill="#131c38" stroke="#263968" stroke-width="1"/>
    <text x="186" y="24" fill="#94a3b8" font-family="system-ui" font-size="11">API UPTIME</text>
    <text x="186" y="48" fill="#00f2fe" font-family="system-ui" font-weight="bold" font-size="18">99.98%</text>

    <rect x="340" y="0" width="150" height="64" rx="10" fill="#131c38" stroke="#263968" stroke-width="1"/>
    <text x="356" y="24" fill="#94a3b8" font-family="system-ui" font-size="11">PAYMENT GATEWAYS</text>
    <text x="356" y="48" fill="#38ef7d" font-family="system-ui" font-weight="bold" font-size="18">Paystack/Monnify</text>

    <rect x="510" y="0" width="160" height="64" rx="10" fill="#131c38" stroke="#263968" stroke-width="1"/>
    <text x="526" y="24" fill="#94a3b8" font-family="system-ui" font-size="11">DAILY BOOKINGS</text>
    <text x="526" y="48" fill="#c084fc" font-family="system-ui" font-weight="bold" font-size="18">5,420+ / Day</text>
  </g>

  <!-- Main API & Network Map Representation -->
  <g transform="translate(64, 184)">
    <rect x="0" y="0" width="410" height="236" rx="12" fill="#0b1021" stroke="#1f2c4f" stroke-width="1"/>
    <text x="20" y="32" fill="#e2e8f0" font-family="system-ui" font-weight="bold" font-size="14">Multi-Transit Live Routing Engine</text>
    <text x="20" y="52" fill="#64748b" font-family="system-ui" font-size="12">Plateau Riders • Tincitymetro Bus • Valgee Transport • Swiftlane</text>

    <!-- Network Graph Nodes -->
    <path d="M 60 140 Q 150 90 220 130 T 360 110" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.8"/>
    <path d="M 60 140 Q 140 180 230 150 T 360 180" fill="none" stroke="#7928ca" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
    
    <circle cx="60" cy="140" r="12" fill="#00f2fe" filter="url(#glow1)"/>
    <circle cx="60" cy="140" r="6" fill="#ffffff"/>
    <text x="60" y="170" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">Jos Terminal</text>

    <circle cx="220" cy="130" r="10" fill="#7928ca"/>
    <circle cx="220" cy="130" r="5" fill="#ffffff"/>
    <text x="220" y="160" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">Abuja Transit</text>

    <circle cx="360" cy="110" r="14" fill="#38ef7d" filter="url(#glow1)"/>
    <circle cx="360" cy="110" r="7" fill="#ffffff"/>
    <text x="360" y="140" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">Lagos Hub</text>
  </g>

  <!-- Right Code / JSON Response Preview -->
  <g transform="translate(490, 184)">
    <rect x="0" y="0" width="244" height="236" rx="12" fill="#070a14" stroke="#1f2c4f" stroke-width="1"/>
    <text x="16" y="28" fill="#38ef7d" font-family="Courier, monospace" font-size="12">HTTP/1.1 200 OK</text>
    <text x="16" y="48" fill="#64748b" font-family="Courier, monospace" font-size="11">Content-Type: application/json</text>
    
    <text x="16" y="80" fill="#e2e8f0" font-family="Courier, monospace" font-size="11">{</text>
    <text x="28" y="100" fill="#00f2fe" font-family="Courier, monospace" font-size="11">"status": <tspan fill="#38ef7d">"success"</tspan>,</text>
    <text x="28" y="120" fill="#00f2fe" font-family="Courier, monospace" font-size="11">"operator": <tspan fill="#f59e0b">"Plateau Riders"</tspan>,</text>
    <text x="28" y="140" fill="#00f2fe" font-family="Courier, monospace" font-size="11">"seat_reserved": <tspan fill="#c084fc">true</tspan>,</text>
    <text x="28" y="160" fill="#00f2fe" font-family="Courier, monospace" font-size="11">"ticket_id": <tspan fill="#f59e0b">"TKR-9824"</tspan>,</text>
    <text x="28" y="180" fill="#00f2fe" font-family="Courier, monospace" font-size="11">"payment_webhook": <tspan fill="#38ef7d">"verified"</tspan></text>
    <text x="16" y="200" fill="#e2e8f0" font-family="Courier, monospace" font-size="11">}</text>
  </g>
</svg>
